/* ---------- References ---------- */
.refs { display: grid; gap: 8px; }
.ref { display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); }
.ref.sel { border-color: var(--lav); box-shadow: var(--ring); }
.ref .sc { width: 40px; height: 40px; border-radius: 10px; background: var(--night); color: #fff; display: grid; place-items: center; font-weight: 650; font-size: 14px; }
.ref b { font-weight: 600; color: var(--ink); display: block; }
.ref small { color: var(--muted); font-size: 12.5px; display: block; }
.ref em { display: block; font-family: var(--serif); font-size: 14px; color: var(--sub); margin-top: 4px; }
/* ---------- Calendar ---------- */
.cal { padding: 20px; display: grid; gap: 14px; overflow-x: auto; }
.cal-g { min-width: 820px; display: grid; gap: 0; }
.cal-h, .cal-r { display: grid; grid-template-columns: 220px minmax(0,1fr); gap: 16px; align-items: center; }
.cal-axis { position: relative; height: 34px; }
.cal-axis span { position: absolute; top: 6px; font-size: 12px; font-weight: 600; color: var(--muted); transform: translateX(4px); }
.cal-axis .today { position: absolute; top: 0; bottom: -6px; width: 0; }
.cal-axis .today b { position: absolute; top: 0; left: -24px; font-size: 11px; font-weight: 600; color: #fff; background: var(--lav); border-radius: 99px; padding: 2px 8px; font-style: normal; }
.cal-r { padding: 14px 0; border-top: 1px solid var(--line); }
.cal-r b { font-weight: 600; color: var(--ink); display: block; font-size: 14px; }
.cal-r small { color: var(--muted); font-size: 12px; }
.cal-r small.bl { color: var(--red-ink); }
.cal-t { position: relative; height: 40px; }
.cal-t .mline { position: absolute; top: -14px; bottom: -14px; width: 1px; background: var(--line); }
.cal-t .tline { position: absolute; top: -14px; bottom: -14px; width: 2px; background: rgba(151,115,255,.5); }
.cal-t .span { position: absolute; top: 15px; height: 10px; border-radius: 99px; background: var(--lav-100); }
.mk { position: absolute; top: 12px; width: 16px; height: 16px; margin-left: -8px; border-radius: 99px; background: var(--card); border: 2.5px solid var(--lav); box-sizing: border-box; display: inline-block; }
.mk.live { background: var(--lav); transform: rotate(45deg); border-radius: 3px; }
.mk.block { border-color: var(--red-ink); }
.mk.live.block { background: var(--red-ink); }
.mk em { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 11px; color: var(--sub); white-space: nowrap; }
.mk.live em { transform: rotate(-45deg) translate(-2px, 18px); left: -6px; top: 4px; }
.cal-k { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.cal-k span { display: flex; gap: 8px; align-items: center; }
.cal-k .mk { position: static; margin: 0; }
/* ---------- Framework ---------- */
.fw { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 22px; align-items: start; }
.fw .fld input { width: 100%; box-sizing: border-box; border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 13px; background: var(--card); font-weight: 600; outline: none; }
.fw .fld input:focus { border-color: var(--lav); box-shadow: var(--ring); }
.fw-p { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.fw-r { display: grid; gap: 8px; }
.fw-r label { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 10px; align-items: start; font-size: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.fw-r input { width: 17px; height: 17px; margin: 2px 0 0; accent-color: var(--lav); }
.ctx .slide { border-radius: 10px; }
@media (max-width: 980px) {
  .coach, .fw, .fw-p { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* Fraunces headings (Regular, SOFT 30, −0.024 em), Hanken Grotesk for everything else, Caveat for short notes.
   Sky and Night are the only brand gradients. Paper replaces white, Ink replaces black, Plum leads. */
:root {
  --page: #F1EFE9; --card: #FBFAF7; --warm: #FBFAF7;
  --ink: #1F1B2E; --text: #1F1B2E; --sub: #4A4458; --muted: #6A6377; --faint: #8F889C;
  --line: #E2DDD2; --line-2: #D3CDC0;
  --lav: #6B45C9; --lav-hover: #7C56DA; --lav-press: #5A36B5; --lav-ink: #6B45C9; --lav-50: #F6F2FF; --lav-100: #E9E4F4;
  --royal: #2D0C69; --plum: #2D0C69; --plum-950: #1F0850; --lav-500: #9773FF;
  --night: #1B1038; --night-2: #221646; --night-3: #2A1A55; --night-line: rgba(233,228,244,.12); --night-text: #F6F2FF; --night-sub: #B7AECF;
  --sky: linear-gradient(160deg, #FFD8BA 0%, #F7D5E4 34%, #E3D5F3 68%, #CDC0EA 100%);
  --nightg: linear-gradient(170deg, #2A1A55 0%, #221646 36%, #1B1038 70%, #0E0722 100%);
  --ink-glow: var(--nightg);
  --glow: 0 8px 24px rgba(45,12,105,.28); --ring: 0 0 0 4px rgba(151,115,255,.28);
  --shadow-sm: 0 1px 2px rgba(31,27,46,.05), 0 2px 6px rgba(31,27,46,.04);
  --shadow-md: 0 4px 14px rgba(31,27,46,.07), 0 2px 4px rgba(31,27,46,.04);
  --shadow-lg: 0 18px 44px rgba(31,27,46,.10), 0 4px 12px rgba(31,27,46,.05);
  --sans: "Hanken Grotesk", -apple-system, "Segoe UI", Roboto, sans-serif;
  --brand-sans: "Hanken Grotesk", -apple-system, "Segoe UI", sans-serif;
  --serif: "Fraunces", Georgia, serif;
  --display: "Fraunces", Georgia, serif;
  --hand: "Caveat", "Segoe Print", cursive;
}
body { font-feature-settings: normal; background: var(--page); }
h1, h2, .page-title h1, .hero h1, .ink h1, .studio-bar h2 { font-family: var(--display); font-weight: 400; letter-spacing: -.024em; font-variation-settings: "SOFT" 30, "WONK" 0; }
h3 { letter-spacing: -.01em; }
h1 em, h2 em { font-style: italic; color: var(--lav); }
.page-title h1 { font-size: clamp(32px, 3.6vw, 42px); }
/* rail and dark bands on Night */
.rail { background: var(--nightg); }
.ink, .hero.dark, .ctx { background: var(--nightg); }
/* buttons: Plum leads */
.btn-primary { background: var(--plum); box-shadow: none; }
.btn-primary:hover { background: var(--plum-950); }
.btn-dark { background: var(--plum); }
.card { background: var(--card); }
.pill.live { background: #E9E4F4; color: #2D0C69; }
.badge.hot { background: #9773FF; }
.eyebrow, .lbl, .nav-label { letter-spacing: .08em; }
/* ---------- slides in the platform ---------- */
.slide { background: #F1EFE9; color: #1F1B2E; font-family: var(--brand-sans); }
.slide h3 { font-family: var(--display); font-weight: 400; letter-spacing: -.024em; font-variation-settings: "SOFT" 30, "WONK" 0; color: #2D0C69; line-height: 1.04; }
.slide h3 em { font-style: italic; color: #6B45C9; }
.slide p { color: #4A4458; }
.slide .wm { color: #2D0C69; }
.slide .ey { background: #E9E4F4; color: #6B45C9; font-weight: 600; }
.slide .ft { color: #6A6377; }
.slide.cover { background: var(--sky); }
.slide.cover::before, .slide.dark::before { content: none; }
.slide.cover .wm { color: #2D0C69; }
.slide.cover h3 { color: #2D0C69; letter-spacing: -.024em; }
.slide.cover h3 em { color: #6B45C9; }
.slide.cover p { color: #4A4458; }
.slide.cover .ey { background: rgba(255,255,255,.55); color: #2D0C69; box-shadow: none; }
.slide.cover .ft { color: #6A6377; }
.slide.dark { background: var(--nightg); }
.slide.dark .wm, .slide.dark h3 { color: #F6F2FF; }
.slide.dark h3 em { color: #CDC0EA; }
.slide.dark p { color: #E9E4F4; }
.slide.dark .ey { background: rgba(246,242,255,.08); color: #F6F2FF; box-shadow: inset 0 0 0 1px rgba(233,228,244,.2); }
.slide.dark .ft { color: #B7AECF; }
.slide .pain { background: #FBFAF7; box-shadow: 0 .3cqw 1.4cqw rgba(31,27,46,.07); }
.slide .pain b { color: #6B45C9; }
.slide .pain b::before { background: #9773FF; }
.slide .pain p { color: #1F1B2E; }
.slide .proof { background: #E9E4F4; color: #2D0C69; }
.slide .proof i { background: #2D0C69; }
.slide .stagep { background: var(--sky); }
.slide .stagep::before { content: none; }

  $$('[data-soonlib]').forEach(b => b.addEventListener('click', () => toast(`${b.dataset.soonlib} are coming to the Library.`)));
  $$('[data-regen]').forEach(b => b.addEventListener('click', () => { const a = ASSETS.find(x => x.id === b.dataset.regen); a.status = 'proposed'; a.why = 'New version rendered from Prototype Lab on 20 Oct'; render(); toast(S.role === 'pmm' ? 'New version rendered. Approve it to make it current.' : 'New version rendered and sent to PMM. Existing decks keep the version they were made with.'); }));
  $$('[data-approve]').forEach(b => b.addEventListener('click', () => { const a = ASSETS.find(x => x.id === b.dataset.approve); a.status = 'current'; a.date = '20 Oct'; a.why = ''; logEv('Tobias', 'Approved', `Library · ${a.title} · new version`, 'Old version kept'); render(); toast('Approved. New decks use this version, and the old one is kept in version history.'); }));
}

const fd = d => d ? `${+d.slice(8, 10)} ${MON3[+d.slice(5, 7) - 1]}${d.slice(0, 4) !== '2026' ? ' ' + d.slice(0, 4) : ''}` : '—';
const addDays = (d, n) => new Date(Date.parse(d) + n * 864e5).toISOString().slice(0, 10);
const EARLY = ['Backlog', 'Candidate', 'In Discovery'];
function gateOf(status, vis) { if (vis !== 'External') return 'block'; if (status === 'Full Release') return 'live'; if (EARLY.includes(status)) return 'block'; return 'soon'; }
LINEAR_RAW.forEach(([lid, name, status, tier, vis, target, done, lead, team, summary, gtm, bet]) => {

  const base = { lid, status, tier, vis, lead, team, gtm: !!gtm, bet: !!bet, targetISO: target, doneISO: done, due, summaryL: summary, gate: gateOf(status, vis) };
  if (ex) { Object.assign(ex, base, { target: done ? 'Released ' + fd(done) : fd(target) }); if (vis === 'No label') ex.nolabel = true; return; }
  RELEASES.push({ id: 'L' + lid, name, short: name, ...base, target: done ? 'Released ' + fd(done) : fd(target), lite: true, nolabel: vis === 'No label' || undefined, summary: summary || '' });
