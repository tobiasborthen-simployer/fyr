.onep-h h3 { color: #fff; font-family: var(--serif); font-weight: 500; font-size: 30px; letter-spacing: -.03em; }
.onep-h p { color: #D9CEFF; font-family: var(--serif); font-style: italic; font-size: 16px; }
.onep-r { display: grid; grid-template-columns: 1fr 1.3fr 150px; gap: 16px; padding: 16px 22px; border-bottom: 1px solid #EEEAF0; align-items: center; }
.onep-r b { font-weight: 600; color: #0D0A16; display: block; }

.onep-r img { width: 100%; border-radius: 6px; box-shadow: 0 6px 18px rgba(57,30,132,.14); }
.onep-f { display: flex; justify-content: space-between; gap: 12px; padding: 14px 22px; font-size: 12px; color: #808080; flex-wrap: wrap; }
.vid { position: relative; border-radius: 14px; overflow: hidden; background: var(--night); }
.vid video { width: 100%; display: block; aspect-ratio: 1280 / 620; object-fit: cover; }
.vid-t { position: absolute; left: 12px; bottom: 12px; background: rgba(18,17,31,.8); color: #fff; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 99px; }
.script { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.script li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; font-size: 14px; }
.script span { font-variant-numeric: tabular-nums; color: var(--lav-ink); font-weight: 600; }
.wn { display: grid; gap: 12px; }
.wn-i { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; justify-items: start; }
.wn-i b { font-weight: 600; color: var(--ink); margin-top: 4px; }
.wn-i small { color: var(--muted); font-size: 12.5px; }
.wn-i p { font-size: 14px; }
.wn-a { display: flex; gap: 12px; padding: 14px 16px; border-radius: 12px; background: var(--amber-50); color: var(--amber-ink); }
.wn-a b { color: #5E3A00; display: block; }
.wn-a p { color: #7A5410; font-size: 13.5px; }
.out-b .lang, .news .lang { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; background: var(--warm); }
.out-b .lang b { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--lav-ink); }
.guide { display: grid; gap: 14px; }
.g-s { display: grid; grid-template-columns: 32px minmax(0,1fr) 200px; gap: 14px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.g-n { width: 32px; height: 32px; border-radius: 99px; background: var(--night); color: #fff; display: grid; place-items: center; font-weight: 600; }
.g-s b { font-weight: 600; color: var(--ink); }
.g-s p { font-size: 13.5px; color: var(--sub); }
.g-s img { width: 100%; border-radius: 6px; border: 1px solid var(--line); }
.plan { display: grid; gap: 0; position: relative; }
.p-s { display: grid; grid-template-columns: 76px minmax(0,1fr); gap: 16px; padding: 12px 0; border-left: 2px solid var(--line-2); margin-left: 37px; padding-left: 0; position: relative; }
.p-s .p-d { margin-left: -39px; width: 76px; height: 28px; border-radius: 99px; background: var(--card); border: 1px solid var(--line-2); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--sub); }
.p-s.on .p-d { background: var(--lav); border-color: var(--lav); color: #fff; box-shadow: var(--glow); }
.p-s b { font-weight: 600; color: var(--ink); }
.p-s p { font-size: 13.5px; color: var(--sub); }
.p-s small { font-size: 12px; color: var(--muted); }
.ans { display: grid; gap: 14px; }
.ans-a { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; justify-items: start; background: var(--warm); }
.ans-a p { font-size: 15px; line-height: 1.6; }
.ans-src { display: flex; gap: 6px; flex-wrap: wrap; }
.ans-more { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ans-more b { width: 100%; font-size: 13px; color: var(--muted); font-weight: 500; }
.lb { display: grid; gap: 16px; }
.lb-k { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
.lb-k div { background: var(--night); color: #fff; border-radius: 12px; padding: 12px 14px; display: grid; }
.lb-k b { font-size: 24px; font-weight: 650; letter-spacing: -.03em; }
.lb-k small { color: var(--night-sub); font-size: 12px; }
.lb dl { margin: 0; display: grid; grid-template-columns: 90px minmax(0,1fr); gap: 10px 16px; font-size: 14px; }
.lb dt { color: var(--muted); }
.lb dd { margin: 0; }
.ctx .btn-ghost-n { width: 100%; }
.ctx .checks div { color: #E9E4F4; }

/* ---------- Channels ---------- */
.soc { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.soc-i { padding: 14px; display: grid; gap: 10px; align-content: start; justify-items: start; }
.soc-i .shot { width: 100%; box-sizing: border-box; }
.soc-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; width: 100%; }
.soc-h b { font-weight: 600; color: var(--ink); }
.soc-h .pill { margin-left: auto; }
.soc-i p { font-size: 14px; }
.ads { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.adsets { display: grid; gap: 18px; }
.adset { padding: 18px; display: grid; gap: 14px; }
.ad { overflow: hidden; display: grid; align-content: start; }
.banner { position: relative; aspect-ratio: 1.91 / 1; overflow: hidden; background: #2D0C69; }
.banner img { position: absolute; right: -18%; top: 16%; width: 78%; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.banner .bn-t { position: absolute; inset: 0; padding: 18px; display: grid; align-content: start; gap: 6px; max-width: 56%; color: #fff; background: linear-gradient(90deg, #2D0C69 55%, rgba(57,30,132,0)); width: 70%; }
.bn-tag { font-size: 11px; font-weight: 600; letter-spacing: .02em; color: #CDBBFF; }
.banner b { font-family: var(--serif); font-weight: 500; font-size: 20px; line-height: 1.12; letter-spacing: -.02em; max-width: 14ch; }
.banner span:not(.bn-tag) { font-size: 12.5px; color: #E6DEFF; max-width: 22ch; }
.banner i { position: absolute; left: 18px; bottom: 14px; font-style: normal; font-weight: 700; font-size: 12px; }
.ad-b { padding: 14px; display: grid; gap: 8px; justify-items: start; }
.ad-b p { font-size: 14px; }
.ad-hl { font-weight: 600; color: var(--ink); }
.vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.vd { overflow: hidden; display: grid; align-content: start; }
.vd .vid { border-radius: 0; }
.news { padding: 20px; display: grid; gap: 16px; max-width: 760px; }
.news-b { display: grid; gap: 14px; border: 1px solid var(--line); border-radius: 14px; padding: 20px; background: #FFFCFB; }
.news-b h3 { font-family: var(--serif); font-weight: 500; font-size: 26px; letter-spacing: -.03em; }
.news-r { display: grid; grid-template-columns: 180px minmax(0,1fr); gap: 16px; align-items: center; }
.news-r img { width: 100%; border-radius: 6px; border: 1px solid var(--line); }
.news-r b { font-weight: 600; color: var(--ink); display: block; }
.news-r p { font-size: 14px; color: var(--sub); }

/* ---------- Insights additions ---------- */
.funnel { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
.funnel div { border-radius: 14px; padding: 14px 16px; background: var(--lav-50); border: 1px solid #E3D9FF; display: grid; gap: 4px; }
.funnel b { font-size: 28px; font-weight: 650; letter-spacing: -.03em; color: var(--ink); }
.funnel span { font-weight: 600; color: var(--lav-ink); font-size: 13px; }
.funnel small { color: var(--muted); font-size: 12.5px; }
.toplist { display: grid; gap: 10px; }
.toplist .r { display: grid; grid-template-columns: 72px minmax(0,1fr) auto; gap: 12px; align-items: center; }
.toplist img { width: 72px; height: 40px; object-fit: cover; object-position: left top; border-radius: 6px; border: 1px solid var(--line); }
.toplist b { font-weight: 600; color: var(--ink); display: block; font-size: 13.5px; }
.toplist small { color: var(--muted); font-size: 12px; }
@media (max-width: 980px) { .funnel, .lb-k { grid-template-columns: repeat(2, minmax(0,1fr)); } .onep-r { grid-template-columns: 1fr 1fr; } .onep-r img { display: none; } .g-s { grid-template-columns: 32px minmax(0,1fr); } .g-s img { grid-column: 2; } }
@media (max-width: 760px) { .news-r { grid-template-columns: 1fr; } .lb dl { grid-template-columns: 1fr; gap: 2px; } .lb dd { margin-bottom: 8px; } }

/* ---------- Slack drawer ---------- */
.sl-scrim { position: fixed; inset: 0; background: rgba(18,17,31,.35); z-index: 40; }
.slack-d { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 41; background: #FFFFFF; box-shadow: -20px 0 50px rgba(18,17,31,.25); display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.sl-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 18px; background: #3F0E40; color: #fff; }
.sl-h b { display: block; font-weight: 700; }
.sl-h small { color: #D7C2D8; font-size: 12px; }
.sl-h .icon-btn { background: rgba(255,255,255,.1); border-color: transparent; color: #fff; box-shadow: none; }
.sl-b { overflow-y: auto; padding: 8px 0; }
.sl-m { display: grid; grid-template-columns: 36px minmax(0,1fr); gap: 10px; padding: 12px 18px; }
.sl-m:hover { background: #F8F8F8; }
.sl-m .bot { width: 36px; height: 36px; border-radius: 8px; background: var(--night); display: grid; place-items: center; }
.sl-m .bot .ai { fill: #CDC0EA; }
.sl-n { display: flex; gap: 6px; align-items: baseline; white-space: nowrap; }
.sl-n b { font-weight: 700; color: #1D1C1D; }
.sl-n .app { font-size: 10px; font-weight: 700; color: #616061; background: #EEE; border-radius: 3px; padding: 1px 4px; }
.sl-n small { color: #616061; font-size: 12px; }
.sl-m p { font-size: 14.5px; color: #1D1C1D; margin-top: 2px; line-height: 1.45; }
.sl-a { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.sb { height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid #C9C9C9; background: #fff; font-weight: 700; font-size: 13px; color: #1D1C1D; }
.sb:hover { background: #F4F4F4; }
.sb.p { background: #007A5A; border-color: #007A5A; color: #fff; }
.sb.p:hover { background: #148567; }
.sl-f { border-top: 1px solid #E8E8E8; padding: 12px 18px; font-size: 12.5px; color: #616061; }

/* ---------- Training ---------- */
.learn { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.lc { overflow: hidden; display: grid; align-content: start; }
.lc-i .shot { border-radius: 0; }
.lc-b { padding: 16px; display: grid; gap: 8px; justify-items: start; }
.lc-b .meter { height: 6px; }
.lesson { max-width: 720px; width: 100%; box-sizing: border-box; padding: 28px; display: grid; gap: 18px; margin: 0 auto; }
.lesson h2 { font-size: 28px; }
.ls-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ls-dots { display: flex; gap: 6px; }
.ls-dots i { width: 28px; height: 4px; border-radius: 99px; background: var(--line-2); }
.ls-dots i.on { background: var(--lav); }
.ls-p { font-size: 17px; line-height: 1.6; color: var(--text); }
.qz { display: grid; gap: 10px; padding: 14px 0; border-top: 1px solid var(--line); }
.qz b { font-weight: 600; color: var(--ink); }
.qz-o { display: grid; gap: 8px; }
.qz-b { text-align: left; padding: 11px 14px; border-radius: 10px; border: 1.5px solid var(--line-2); background: var(--card); font-weight: 500; }
.qz-b:hover:not(:disabled) { border-color: var(--lav); background: var(--lav-50); }
.qz-b.ok { border-color: var(--green); background: var(--green-50); color: var(--green-ink); }
.qz-b.bad { border-color: #E5A0A0; background: var(--red-50); color: var(--red-ink); }
.qz-b:disabled { cursor: default; }
.qz-w { font-size: 13.5px; }
.qz-w.ok { color: var(--green-ink); }
.qz-w.bad { color: var(--red-ink); }
.ls-done { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 14px; background: var(--night); color: #fff; flex-wrap: wrap; }
.ls-done .ico { color: #6FD3A5; width: 26px; height: 26px; }
.ls-done b { display: block; }
.ls-done small { color: var(--night-sub); }
.ls-done .btn { margin-left: auto; }

/* ---------- Coach ---------- */
.coach { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; align-items: start; }
.obj { display: grid; gap: 6px; justify-items: start; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.obj:last-child { border-bottom: 0; padding-bottom: 0; }
.obj b { font-weight: 600; color: var(--ink); }
.obj p { font-size: 13.5px; color: var(--sub); }
.hl { display: grid; gap: 10px; }
.hl div { display: grid; grid-template-columns: 140px minmax(0,1fr); gap: 10px; align-items: center; font-size: 13.5px; }
.hl .pill { justify-self: start; }
table.sf td { padding: 8px 6px; font-size: 13.5px; }
table.sf td:first-child { padding-left: 0; }

/* ---------- Battlecards ---------- */
.bc-a { border-radius: 14px; background: var(--night); color: #fff; padding: 16px 18px; display: grid; gap: 6px; }
.bc-a p { font-size: 16px; line-height: 1.55; }
.lbl2 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #CDC0EA; }
.bc-d { margin: 0; display: grid; grid-template-columns: 90px minmax(0,1fr); gap: 8px 14px; font-size: 14px; }
.bc-d dt { color: var(--muted); }
.bc-d dd { margin: 0; }
.rivals { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }

/* ---------- Battlecards v2 ---------- */
.bc-meta { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--sub); margin-top: -6px; }
.bc-meta > span:first-child { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; color: var(--ink); }
.bc-meta .ai { fill: var(--lav); width: 14px; height: 14px; }
.bc-meta .btn { margin-left: auto; }
.bc-frame { font-size: clamp(17px, 1.7vw, 21px); line-height: 1.5; color: #fff; max-width: 70ch; letter-spacing: -.01em; }
.bc-know { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.bc-know div { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 10px; padding: 14px; border-radius: 14px; background: rgba(255,255,255,.05); border: 1px solid var(--night-line); }
.bc-know b { width: 26px; height: 26px; border-radius: 99px; background: var(--lav); color: #fff; display: grid; place-items: center; font-size: 13px; }
.bc-know p { font-size: 13.5px; color: #E9E4F4; line-height: 1.5; }
.bc-know p b { all: unset; color: #fff; font-weight: 600; }
.bc-hero .ktiles small { overflow-wrap: anywhere; }
.bc-search { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 0 16px; box-shadow: var(--shadow-sm); }
.bc-search:focus-within { border-color: var(--lav); box-shadow: var(--ring); }
.bc-search .ico { color: var(--muted); }
.bc-search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; height: 50px; font-size: 15px; }
.bc-hits { display: grid; gap: 10px; }
.bc-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.bc-p { text-align: left; display: grid; gap: 6px; justify-items: start; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s; }
.bc-p:hover { border-color: #CFC2FF; }
.bc-p.sel { border-color: var(--lav); box-shadow: var(--ring); }
.bc-p b { font-weight: 650; font-size: 16px; color: var(--ink); letter-spacing: -.01em; }
.bc-p small { color: var(--muted); font-size: 12.5px; }
.bc-notes { display: grid; gap: 8px; }
.bc-notes div { display: flex; gap: 10px; align-items: start; font-size: 13.5px; color: var(--sub); padding: 10px 14px; border-radius: 12px; background: var(--warm); border: 1px dashed var(--line-2); }
.bc-notes .ico { width: 15px; height: 15px; color: var(--amber-ink); margin-top: 2px; }
.bc-card { padding: clamp(18px, 2.6vw, 28px); display: grid; grid-template-columns: minmax(0,1fr); gap: 22px; }
.bc-card h3 { font-size: 15px; font-weight: 650; color: var(--ink); display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.bc-card h3 .muted { font-weight: 400; font-size: 13.5px; }
.bc-card h3 .ico { width: 16px; height: 16px; }
.bc-h { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: start; }
.bc-h h2 { font-size: clamp(26px, 3vw, 34px); margin: 4px 0 6px; }
.bc-h p { font-size: 13.5px; max-width: 70ch; }
.bc-rec { display: flex; gap: 6px; flex-wrap: wrap; max-width: 420px; justify-content: flex-end; }
.bc-rec .pill { white-space: normal; height: auto; min-height: 24px; padding: 3px 10px; }
.bc-pos { font-size: 18px !important; color: #fff; font-weight: 500; letter-spacing: -.01em; }
.bc-a p b { color: #fff; }
.bc-fr { margin: 0; padding: 18px 20px; border-radius: 14px; background: var(--lav-50); border: 1px solid #E3D9FF; border-left: 4px solid var(--lav); display: grid; gap: 6px; }
.bc-fr p { font-size: 16.5px; line-height: 1.55; color: var(--ink); }
.bc-2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; }
.bc-2 > section { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.bc-do { background: var(--green-50); border-color: #CDEBDD !important; }
.bc-do h3 { color: var(--green-ink); }
.bc-dont { background: var(--red-50); border-color: #F2D2D2 !important; }
.bc-dont h3 { color: var(--red-ink); }
.bc-l { margin: 0; padding-left: 18px; display: grid; gap: 7px; font-size: 14px; line-height: 1.5; color: var(--text); }
.bc-l li::marker { color: var(--faint); }
.bc-edge { border-radius: 14px; padding: 18px 20px; background: var(--ink-glow); color: var(--night-text); }
.bc-edge h3 { color: #fff; }
.bc-edge h3 .ai { fill: #CDC0EA; }
.bc-edge .bc-l { color: #DCD8EE; }
.bc-edge .bc-l b { color: #fff; }
.bc-mines { margin: 0; padding: 0; list-style: none; counter-reset: m; display: grid; gap: 8px; }
.bc-mines li { counter-increment: m; display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; font-size: 14.5px; }
.bc-mines li::before { content: counter(m); width: 28px; height: 28px; border-radius: 99px; background: var(--night); color: #fff; display: grid; place-items: center; font-size: 12.5px; font-weight: 600; }
.bc-mines .icon-btn { width: 32px; height: 32px; box-shadow: none; }
.bc-objs { display: grid; gap: 8px; }
.bc-obj { border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.bc-obj summary { cursor: pointer; padding: 13px 16px; font-weight: 600; color: var(--ink); list-style: none; display: flex; justify-content: space-between; gap: 10px; }
.bc-obj summary::after { content: '+'; color: var(--muted); font-weight: 400; font-size: 18px; line-height: 1; }
.bc-obj[open] summary::after { content: '–'; }
.bc-obj summary::-webkit-details-marker { display: none; }
.bc-obj p { padding: 0 16px 14px; font-size: 14.5px; line-height: 1.6; color: var(--text); }
div.bc-obj { padding: 13px 16px; display: grid; gap: 6px; }
div.bc-obj p { padding: 0; }
.pill.flag { height: 20px; font-size: 11px; padding: 0 8px; vertical-align: 1px; }
.pill.flag .ico { width: 11px; height: 11px; }
/* editor */
.bc-imp { display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 16px 18px; }
.bc-imp-i { width: 40px; height: 40px; border-radius: 12px; background: #3F0E40; color: #fff; display: grid; place-items: center; }
.bc-imp b { font-weight: 600; color: var(--ink); }

function buildDeck() {
  const b = S.brief, m = S.meeting;

  b.features.filter(k => FEATURES[k].state === 'live').forEach(k => { const a = ASSETS.find(x => x.f === k && x.status === 'current'); slides.push({ kind: 'feature', f: k, visual: a ? a.type : 'screenshot' }); });
  b.features.filter(k => FEATURES[k].state === 'soon').forEach(k => slides.push({ kind: 'soon', f: k }));
  if (b.ref) slides.push({ kind: 'ref', ref: b.ref });
  slides.push({ kind: 'why' }, { kind: 'next' });
  S.deck = { company: m.company, occasion: b.occasion, lang: b.lang, slides, presented: false };

function makePack(r, scope) {
  const d = r.dates, items = [];
  const add = (aud, kind, title, owner, due, status) => { if (scope.includes(aud)) items.push({ id: kind, aud, kind, title, owner, due, status: status || 'draft' }); };
  add('internal', 'brief', 'Release brief', 'T', d.brief);
  add('internal', 'cc', 'Customer Care answer', 'L', d.ready);
  add('internal', 'slack', 'Slack announcement', 'L', d.live);
  add('internal', 'training', 'Ready training', 'L', d.ready);
  add('sales', 'truth', 'Product truth entry', 'PM', d.brief);
  add('sales', 'slide', 'Deck slide', 'TB', d.ready);
  add('sales', 'talk', 'Talk track', 'TB', d.ready);
  add('customers', 'note', 'Release note', 'L', d.live);
  add('customers', 'news', 'Newsletter blurb', 'L', d.live);
  add('customers', 'visual', 'Screenshot and animation', 'TB', d.live);
  add('market', 'linkedin', 'LinkedIn post', 'TB', d.live);
  add('market', 'video', 'Product video', 'TB', d.live);
  if (r.tier === 'T1') add('market', 'ads', 'Paid ads', 'TB', d.live);
  const pb = (typeof PLAYBOOK !== 'undefined' && PLAYBOOK[r.tier]) ? PLAYBOOK[r.tier].kinds : null; const its = pb ? items.filter(i => pb.includes(i.kind)) : items;
  return { rid: r.id, items: its, sel: its[0] ? its[0].id : null, published: false };
}

let NEW = { rid: null, scope: ['internal', 'sales', 'customers', 'market'], over: {}, edit: false };
const DONT_SAY = 'Dates beyond the Linear target. Anything about it as available before release day.';
const BRIEF_KEYS = ['summary', 'problem', 'why', 'who', 'pitch', 'pain', 'avoid', 'pillar'];
const baseVal = (b, k) => k === 'avoid' ? (b.avoid || DONT_SAY) : b[k];
function briefOf(base, over) { const o = over || {}; const m = { ...base, avoid: base.avoid || DONT_SAY }; BRIEF_KEYS.forEach(k => { if (o[k] !== undefined) m[k] = o[k]; }); return m; }
const isEdited = (base, k) => NEW.over[k] !== undefined && JSON.stringify(NEW.over[k]) !== JSON.stringify(baseVal(base, k));
function readBrief(base) {

  const who = v('who').split('\n').map(l => l.trim()).filter(Boolean).map(l => { const i = l.indexOf(':'); return i > 0 ? [l.slice(0, i).trim(), l.slice(i + 1).trim()] : ['Everyone', l]; });

}

  return `<section class="card lin">${head}<h2>${base.name}</h2>
    ${ta('summary', 'Summary', r.summary, 3, 'From Linear')}${ta('problem', 'Problem', r.problem, 3, 'From Linear')}${ta('why', 'Why it matters', r.why, 2, 'From Linear')}
    ${ta('who', 'Who it\u2019s for', r.who.map(w => w[0] + ': ' + w[1]).join('\n'), 3, 'One per line, Role: what they get')}

}

function bindPackNew() {
  const base = relById(NEW.rid);
  $('#edit-brief').addEventListener('click', () => { if (NEW.edit) readBrief(base); NEW.edit = !NEW.edit; render(); });
  if ($('#reset-brief')) $('#reset-brief').addEventListener('click', () => { NEW.over = {}; render(); toast('Back to the text from Linear.'); });
  if ($('#suggest-pm')) $('#suggest-pm').addEventListener('click', () => toast(`Slack message drafted to ${base.lead}: the tuned wording, so Linear can be updated if they agree.`));
  $$('[data-scope]').forEach(c => c.addEventListener('change', () => { NEW.scope = $$('[data-scope]').filter(x => x.checked).map(x => x.dataset.scope); }));
  $('#mkpack').addEventListener('click', () => {
    if (!NEW.scope.length) { toast('Pick at least one audience.'); return; }
    if (NEW.edit) { readBrief(base); NEW.edit = false; }
    const r = briefOf(relById(NEW.rid), NEW.over);
    const steps = [['Reading the release in Linear', `${r.name} · ${r.status} · ${r.vis}`], ['Applying the messaging framework', `Pillar: ${r.pillar} · present tense after release only`], ['Drafting for every audience', `${NEW.scope.length} audiences · NO and SV written natively`], ['Setting owners and due dates', `Brief ${r.dates.brief} · ready ${r.dates.ready} · live ${r.dates.live}`]];
    S.prevNav = 'packs'; S.view = 'gen'; renderNav();
    $('#view').innerHTML = `<section class="card gen"><span class="eyebrow">${ai()} Creating launch pack</span><h2>${r.short}</h2><div class="progress"><i id="pg"></i></div><ol class="gsteps">${steps.map(s => `<li><span class="st">${ico('i-check')}</span><div><b>${s[0]}</b><small>${s[1]}</small></div></li>`).join('')}</ol></section>`;
    const lis = $$('.gsteps li'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; let i = 0;
    const tick = () => { if (i > 0) { lis[i - 1].classList.remove('on'); lis[i - 1].classList.add('done'); } $('#pg').style.width = `${i / lis.length * 100}%`; if (i < lis.length) { lis[i].classList.add('on'); i++; setTimeout(tick, reduce ? 200 : 750); } else { const old = PACKS[r.id]; const np = makePack(r, NEW.scope); np.r = r; np.over = { ...NEW.over }; if (old) np.items.forEach(x => { const o = old.items.find(y => y.id === x.id); if (o && o.status === 'approved') x.status = 'approved'; }); PACKS[r.id] = np; S.pack = r.id; setTimeout(() => { S.view = 'pack'; render(); window.scrollTo({ top: 0 }); }, reduce ? 0 : 300); } };
    tick();
  });
}

function itemBody(r, it) {

const AXL = { NO: { cta: 'Book en demo', v: { a: 'Mennesker', b: 'Produkt', c: 'Hybrid' }, anim: 'Animert', road: 'På vei' }, SV: { cta: 'Boka en demo', v: { a: 'Människor', b: 'Produkt', c: 'Hybrid' }, anim: 'Animerad', road: 'På väg' }, EN: { cta: 'Book a demo', v: { a: 'People', b: 'Product', c: 'Hybrid' }, anim: 'Animated', road: 'Coming soon' } };
const axEm = s => { s = String(s || ''); if (/\*.+?\*/.test(s)) return s.replace(/\*(.+?)\*/, '<em>$1</em>'); const m = s.match(/^(.*\s)(\S+?)([.?!]*)$/); return m ? `${m[1]}<em>${m[2]}</em>${m[3]}` : s; };
const axPlain = s => String(s || '').replace(/\*/g, '');
const axIni = n => n.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
function axFoot(d) { return `<div class="ax-f"><i class="slogo" role="img" aria-label="Simployer"></i><small>${d.product}</small><span class="ax-cta">${(AXL[d.lang] || AXL.NO).cta}</span></div>`; }
function axTxt(d, withLogo) { return `<div class="ax-txt">${withLogo ? '<i class="slogo" role="img" aria-label="Simployer"></i>' : ''}<span class="ax-tag">${d.tag}</span><h4 class="ax-h">${axEm(d.pain)}</h4><p class="ax-s">${d.sol}</p></div>`; }
function axMsgs(d, n) { return `<div class="ax-msgs">${d.msgs.slice(0, n).map(([who, line]) => `<div class="ax-msg"><span class="av">${axIni(who)}</span><div><b>${who}</b><span>${line}</span></div></div>`).join('')}</div>`; }
function axPanel(d) { const p = d.panel; return `<div class="ax-pnl"><div class="hd"><div><small>${p.label}</small><b>${p.title}</b></div><i>${p.badge}</i></div>${p.rows.map(r => r === 'sk' ? '<div class="ax-row sk"><span class="ri"></span><div><b>.</b><span>.</span></div></div>' : `<div class="ax-row"><span class="ri"></span><div><b>${r[0]}</b><span>${r[1]}</span></div><em class="${r[3] === 'ok' ? 'ok' : ''}">${r[2]}</em></div>`).join('')}</div>`; }
function axBar(d) { const n = d.panel.rows.length, k = d.panel.rows.filter(r => r[3] === 'ok').length; return `<div class="ax-bar"><small>${d.panel.label}</small><b>${d.chip.title}</b><div class="seg">${Array.from({ length: Math.max(3, n) }, (_, i) => `<span class="${i < Math.max(1, k) ? 'on' : ''}"></span>`).join('')}</div></div>`; }
function adSq(d, v) {
  const road = d.road ? `<span class="ax-badge">${(AXL[d.lang] || AXL.NO).road}</span>` : '';
  if (v === 'a') return `<div class="ax ax-a ax-anim" role="img" aria-label="${axPlain(d.pain)}"><div class="ax-ph" style="background-image:url('${PH(d.ph[0])}')"></div>${road}<div class="ax-chip"><span class="ic"></span><div><small>${d.chip.label}</small><b>${d.chip.title}</b></div></div>${axTxt(d)}${axFoot(d)}</div>`;
  if (v === 'b') return `<div class="ax ax-b" role="img" aria-label="${axPlain(d.pain)}">${road}${axTxt(d)}${d.scr ? `<span class="ax-scr">${d.scr}</span>` : ''}${axMsgs(d, 3)}${d.note ? `<div class="ax-note">${d.note}</div>` : ''}${axPanel(d)}${axFoot(d)}</div>`;
  return `<div class="ax ax-c ax-anim" role="img" aria-label="${axPlain(d.pain)}"><div class="ax-ph" style="background-image:url('${PH(d.ph[1] || d.ph[0])}')"></div>${axTxt(d, true)}${road}${d.scr ? `<span class="ax-scr">${d.scr}</span>` : ''}${axMsgs(d, 2)}${axBar(d)}${axFoot(d)}</div>`;
}
function adSet(d) { const l = AXL[d.lang] || AXL.NO; return `<div class="axset">${['a', 'b', 'c'].map(v => `<div class="axv"><div class="axv-h"><b>${(d.lang || 'NO').toLowerCase()}${d.n || 1}${v}</b>${l.v[v]}${v !== 'b' ? `<i>${l.anim}</i>` : ''}</div>${adSq(d, v)}</div>`).join('')}</div>`; }
/* a generic set for any release, used in launch packs */
function adFromRelease(r, tag, pain, sol, L) {

}

const CHKST = { r4: { 'Release notes': ['live', 'live'], 'Homepage · What’s new': ['live', 'live'], 'In-app note': ['live', 'miss'], 'Freshdesk article': ['live', 'live'], 'CC macro': ['live', 'live'], 'Customer note': ['sched', 'sched'], 'LinkedIn post': ['na', 'na'], 'Sales kit in the hub': ['na', 'na'] }, r1: {} };

function vCheck() {
  const r = relById(CHK.rel);
  const lab = { live: ['live', 'Live'], sched: ['soon', 'Scheduled'], miss: ['block', 'Missing'], todo: ['line', 'Drafting'], na: ['', 'Not needed'] };
  const all = CHANNELS.flatMap(c => [0, 1].map(i => chkState(r, c, i))).filter(s => s !== 'na');
  const ok = all.filter(s => s === 'live' || s === 'sched').length;
  return `<div class="chk-h"><div class="seg" role="group" aria-label="Release">${['r3', 'r4', 'r1'].map(id => `<button data-chkrel="${id}" aria-pressed="${CHK.rel === id}">${relById(id).short}</button>`).join('')}</div><span class="pill ${ok === all.length ? 'live' : 'warn'}">${ok} of ${all.length} ready · ${r.tier}</span><span class="muted" style="font-size:13px">${r.status === 'Full Release' ? r.target : 'Launch day ' + r.target}</span></div>
  <section class="card tbl"><table><thead><tr><th>Channel</th><th>Where</th><th>Norwegian</th><th>Swedish</th></tr></thead><tbody>${CHANNELS.map(c => `<tr><td><b>${c[0]}</b></td><td class="muted">${c[1]}</td>${[0, 1].map(i => { const s = chkState(r, c, i), [cl, t] = lab[s]; return `<td><span class="pill ${cl}">${t}</span>${s === 'miss' ? ` <button class="btn btn-line btn-sm" data-chkfix="${esc(c[0])}:${i}">Fix</button>` : ''}</td>`; }).join('')}</tr>`).join('')}</tbody></table></section>
  <p class="muted" style="font-size:13px">The tier decides which channels a release needs, from the Launch tiers document. The check runs on launch day at 09:00 and posts anything missing to the owner in Slack.</p>`;
